services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: morelia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: morelia
      POSTGRES_PASSWORD: morelia_dev_2024
      POSTGRES_DB: morelia_conecta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morelia -d morelia_conecta"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - morelia-net

  # Bun Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: morelia-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://morelia:morelia_dev_2024@postgres:5432/morelia_conecta
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      OSRM_BASE_URL: http://osrm:5000
      PORT: 3000
      HOST: 0.0.0.0
      MOBILITY_MODE: demo
      SIMULATION_SEED: 42
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Mount GeoJSON data
      - ./mobile/assets/geojson:/app/data/geojson:ro
      - ./morelia-rutas:/app/data/morelia-rutas:ro
    networks:
      - morelia-net

  # React operations dashboard
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: morelia-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - morelia-net

  # OSRM for street routing (optional)
  osrm:
    image: osrm/osrm-backend:latest
    container_name: morelia-osrm
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/michoacan-latest.osrm
    volumes:
      - osrm_data:/data
    profiles:
      - osrm
    networks:
      - morelia-net

volumes:
  postgres_data:
  osrm_data:

networks:
  morelia-net:
    driver: bridge
